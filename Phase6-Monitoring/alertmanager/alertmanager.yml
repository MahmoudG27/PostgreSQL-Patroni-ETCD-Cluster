global:
  # ---------------------------------------------------------------
  # SMTP settings — fill these in with the client's actual mail
  # server details before deploying. Many companies already have
  # an internal SMTP relay; ask them for its hostname/port/creds.
  # ---------------------------------------------------------------
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'CHANGE_ME'
  smtp_require_tls: true

# ---------------------------------------------------------------
# Routing tree — decides WHICH alerts go to WHICH receiver, and
# how they're grouped/throttled. Right now everything goes to a
# single email receiver. Adding Slack/PagerDuty/etc. later just
# means adding a new receiver below and a matching route here —
# nothing above this needs to change.
# ---------------------------------------------------------------
route:
  receiver: 'email-default'
  group_by: ['alertname', 'site']
  group_wait: 30s        # wait a bit to bundle related alerts firing together
  group_interval: 5m     # wait before sending a notification about new alerts in an existing group
  repeat_interval: 4h    # re-notify if the alert is still firing after this long

  routes:
    # Critical alerts get re-sent more often so they don't get lost
    - match:
        severity: critical
      receiver: 'email-default'
      repeat_interval: 1h

    # Warning alerts are fine with the default 4h repeat above
    - match:
        severity: warning
      receiver: 'email-default'

receivers:
  - name: 'email-default'
    email_configs:
      - to: 'CHANGE_ME@example.com'   # add one or more recipients, comma-separated
        send_resolved: true            # also notify when an alert clears, not just when it fires

# ---------------------------------------------------------------
# Prevents noisy duplicate alerts: if a more specific/critical
# alert is already firing, don't also fire a related broader one.
# Not used yet (no overlapping alerts defined so far) but left
# here as a ready structure for later.
# ---------------------------------------------------------------
inhibit_rules: []