scope: pg_cluster_hq
namespace: /db
name: hq-node-01

etcd3:
  hosts:
    - 10.0.0.4:2379
    - 10.0.0.5:2379
    - 10.0.0.6:2379
    - 10.0.0.7:2379
    - 10.0.0.8:2379

restapi:
  listen: 10.0.0.4:8008
  connect_address: 10.0.0.4:8008

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: true
    synchronous_mode_strict: false
    synchronous_node_count: 1

    slots:
      dr_standby_slot:
        type: physical

    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 128MB
        max_slot_wal_keep_size: 50GB

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - host replication replicator 10.0.0.0/24 md5
    - host replication replicator 10.1.0.0/24 md5
    - host all all 10.0.0.0/24 md5
    - local all all trust

postgresql:
  listen: 10.0.0.4:5432
  connect_address: 10.0.0.4:5432
  data_dir: /var/lib/postgresql/18/main
  bin_dir: /usr/lib/postgresql/18/bin
  pgpass: /var/lib/postgresql/.pgpass
  authentication:
    replication:
      username: replicator
      password: "YOUR_REPLICATION_PASSWORD"
    superuser:
      username: postgres
      password: "YOUR_SUPERUSER_PASSWORD"

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false