scope: pg_cluster_hq
namespace: /db/
name: hq-node-01

restapi:
  listen: 10.0.0.4:8008
  connect_address: 10.0.0.4:8008

etcd3:
  hosts: 10.0.0.4:2379,10.0.0.5:2379,10.0.0.6:2379,10.0.0.7:2379,10.0.0.8:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    # Enable Synchronous Replication in HQ
    synchronous_mode: true
    synchronous_mode_strict: false      # Prefer "false" because even Replicas down the Primary one doesn't stop

    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 128MB

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - host replication replicator 10.0.0.0/24 md5
    - host all all 10.0.0.0/24 md5
    - host all all 127.0.0.1/32 trust

postgresql:
  listen: 10.0.0.4:5432
  connect_address: 10.0.0.4:5432
  data_dir: /var/lib/postgresql/18/main
  bin_dir: /usr/lib/postgresql/18/bin
  authentication:
    replication:
      username: replicator
      password: replicator_password_CHANGE_ME
    superuser:
      username: postgres
      password: postgres_password_CHANGE_ME

  parameters:
    unix_socket_directories: '/var/run/postgresql'

tags:
    nofailover: false
    noloadbalance: false
    clonefrom: false
    nosync: false